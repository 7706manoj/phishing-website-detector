<!DOCTYPE html>
<html>
<head>
    <title>Phishing URL Detector</title>
    <style>
        body { font-family: Arial; text-align: center; margin-top: 100px; }
        input { width: 400px; padding: 10px; }
        button { padding: 10px 20px; margin-top: 10px; }
        h2 { color: green; }
        h3 { color: red; }
    </style>
</head>
<body>
    <h1>🔍 Phishing URL Detection</h1>
    <form method="POST">
        <input type="text" name="url" placeholder="Enter website link" required>
        <br>
        <button type="submit">Check</button>
    </form>
    {% if result %}
        <h2>{{ result }}</h2>
    {% endif %}
</body>
</html>
